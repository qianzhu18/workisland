server {
    listen 80;
    listen [::]:80;
    server_name workisland.yanglaishe.cn;

    root /var/www/workisland;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name workisland.yanglaishe.cn;

    root /var/www/workisland;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/workisland.yanglaishe.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workisland.yanglaishe.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:workisland_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.(woff2|png|jpg|jpeg|webp|avif|svg|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /download-config.json {
        add_header Cache-Control "no-cache";
        try_files /download-config.json =404;
    }

    location = /releases/latest.json {
        add_header Cache-Control "no-cache";
        try_files /releases/latest.json =404;
    }

    location ^~ /releases/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        return 301 https://workisland.yanglaishe.cn/;
    }

    location = /guide/ {
        try_files /guide/index.html =404;
    }

    location = /guide/index.html {
        return 301 https://workisland.yanglaishe.cn/guide/;
    }

    location = /guides/claude-code-notifications/index.html {
        return 301 https://workisland.yanglaishe.cn/guides/claude-code-notifications/;
    }

    location = /guides/claude-code-notifications/ {
        try_files /guides/claude-code-notifications/index.html =404;
    }

    location = /en/ {
        try_files /en/index.html =404;
    }

    location = /en/index.html {
        return 301 https://workisland.yanglaishe.cn/en/;
    }

    location = /en/claude-code-notifications/index.html {
        return 301 https://workisland.yanglaishe.cn/en/claude-code-notifications/;
    }

    location = /en/claude-code-notifications/ {
        try_files /en/claude-code-notifications/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json font/woff2;
}
