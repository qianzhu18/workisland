name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm ci
      - name: Require release credentials
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "${CSC_LINK:-}"
          test -n "${CSC_KEY_PASSWORD:-}"
          test -n "${APPLE_API_KEY_CONTENT:-}"
          test -n "${APPLE_API_KEY_ID:-}"
          test -n "${APPLE_API_ISSUER:-}"
      - name: Prepare notarization key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          notary_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$notary_key_path"
          chmod 600 "$notary_key_path"
          echo "NOTARY_KEY_PATH=$notary_key_path" >> "$GITHUB_ENV"
      - name: Package macOS DMG
        # An unset CSC_LINK must stay unset. electron-builder treats an empty
        # CSC_LINK as the project directory and then reports "not a file".
        run: |
          if [ -n "${CSC_LINK:-}" ]; then
            npm run package:mac
          else
            env -u CSC_LINK npm run package:mac
          fi
      - name: Verify packaged payload
        run: |
          node <<'NODE'
          const asar = require('@electron/asar');
          const archive = 'release/mac-arm64/WorkIsland.app/Contents/Resources/app.asar';
          const files = new Set(asar.listPackage(archive));
          const required = [
            '/src/main/telemetry-service.cjs',
            '/src/shared/telemetry.cjs',
            '/src/shared/telemetry-consent.cjs',
            '/src/renderer/settings-app.js',
            '/src/renderer/settings-app.css',
            '/src/renderer/island/assets/brands/agent.svg',
            '/src/renderer/island/assets/brands/claude.svg',
            '/src/renderer/island/assets/brands/codebuddy.svg',
            '/src/renderer/island/assets/brands/copilot.svg',
            '/src/renderer/island/assets/brands/cursor.svg',
            '/src/renderer/island/assets/brands/gemini.svg',
            '/src/renderer/island/assets/brands/hermes.svg',
            '/src/renderer/island/assets/brands/kimi.svg',
            '/src/renderer/island/assets/brands/opencode.svg',
            '/src/renderer/island/assets/brands/pi.svg',
            '/src/renderer/island/assets/brands/sara.svg',
            '/src/renderer/island/assets/brands/trae.svg',
            '/src/renderer/island/assets/brands/zcode.svg'
          ];
          const missing = required.filter((file) => !files.has(file));
          const settings = asar.extractFile(archive, 'src/renderer/settings-app.js').toString('utf8');
          if (!settings.includes('AGENT_ICON_URLS')) missing.push('/src/renderer/settings-app.js:AGENT_ICON_URLS');
          const main = asar.extractFile(archive, 'src/main/index.cjs').toString('utf8');
          if (main.includes('isTelemetryConsentPending')) missing.push('/src/main/index.cjs:legacy telemetry consent flow must not ship');
          const telemetry = asar.extractFile(archive, 'src/main/telemetry-service.cjs').toString('utf8');
          const telemetryContract = asar.extractFile(archive, 'src/shared/telemetry.cjs').toString('utf8');
          if (!telemetry.includes('trackLifecycleEvent')) missing.push('/src/main/telemetry-service.cjs:turn lifecycle coalescing');
          if (!telemetryContract.includes('DISABLE_GEOIP_PROPERTY')) missing.push('/src/shared/telemetry.cjs:GeoIP disable contract');
          if (missing.length) {
            console.error(`Packaged payload is incomplete:\n${missing.map((file) => `- ${file}`).join('\n')}`);
            process.exit(1);
          }
          console.log(`Packaged payload OK: ${required.length} assets, default-on telemetry, and privacy guards present.`);
          NODE
      - name: Notarize and staple tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun notarytool submit release/*.dmg --key "$NOTARY_KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple release/*.dmg
          xcrun stapler validate release/*.dmg
          rm -f "$NOTARY_KEY_PATH"
      - name: Verify signed release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          verify_mount="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$verify_mount" release/*.dmg
          codesign --verify --deep --strict --verbose=4 "$verify_mount/WorkIsland.app"
          spctl --assess --type execute --verbose=4 "$verify_mount/WorkIsland.app"
          hdiutil detach "$verify_mount"
          rmdir "$verify_mount"
      - name: Generate checksums
        run: shasum -a 256 release/*.dmg > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WorkIsland-macOS-arm64
          path: |
            release/*.dmg
            release/SHA256SUMS.txt
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            release/*.dmg
            release/SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  # Windows Alpha 内测通道：仅在 v*-alpha.* tag 上构建，产物为未签名安装包，
  # 一定会触发 SmartScreen 提示；正式签名分发另行评审。
  windows-x64-alpha:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-alpha') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
        shell: bash
      - run: npm ci --ignore-scripts
      - name: Package Windows Setup and Portable
        run: npm run package:win
      - name: Smoke test packaged portable build
        shell: bash
        run: |
          exe="$(ls release/*Portable*x64.exe 2>/dev/null | head -1)"
          if [ -z "$exe" ]; then echo "portable exe not found"; ls release; exit 1; fi
          node scripts/smoke-win-packaged.mjs "$exe" 90000
      - name: Collect logs on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p smoke-logs
          cp -r "$APPDATA/WorkIsland/logs" smoke-logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: WorkIsland-Windows-release-smoke-logs
          path: smoke-logs
          if-no-files-found: ignore
      - name: Generate checksums
        shell: bash
        run: cd release && sha256sum *.exe > SHA256SUMS-Windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WorkIsland-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS-Windows.txt
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/SHA256SUMS-Windows.txt
          prerelease: true
          generate_release_notes: true
          body: |
            ⚠️ Windows Alpha 内测版本

            这是 WorkIsland 的首个 Windows 桌面版本（Alpha 级别，正在测试与内测中）。产品可能存在问题，不建议作为日常主力工具使用；遇到 Bug 请通过 [Issue](https://github.com/qianzhu18/workisland/issues) 或内测群反馈。

            - 支持 Windows 11 x64，提供 NSIS 安装包与便携版
            - 安装包未签名，首次运行可能弹出 SmartScreen 警告（点击「仍要运行」）
            - 已知限制：无法按 WT_SESSION 精确切换 Windows Terminal 标签页；不支持 Windows 10 / 32 位；暂无自动更新
            - macOS 稳定版请前往 [v3.0.0](https://github.com/qianzhu18/workisland/releases/latest)
