name: check

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:assets
      - run: npm run check

  native-macos:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Electron binary (retry; npm ci skips postinstall)
        run: |
          for attempt in 1 2 3; do
            echo "Electron install attempt ${attempt}"
            if node node_modules/electron/install.js; then
              echo "Electron binary installed"
              exit 0
            fi
            sleep 10
          done
          echo "Electron install failed after 3 attempts"
          exit 1
      - run: npm run build:assets
      - run: npm run build:native
      - run: npm run check

  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:assets
      - run: npm run check
