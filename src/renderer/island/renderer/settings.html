<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="settings.window.title">WorkIsland Settings</title>
    <link rel="stylesheet" href="../../settings-app.css">
    <script type="module" src="../../settings-app.js"></script>
  </head>
  <body>
    <main class="window">
      <aside class="sidebar">
        <div class="brand"><img class="brand-mark" src="../assets/workisland-icon.png" alt="" draggable="false"><span>WorkIsland</span></div>
        <nav class="nav" aria-label="Settings categories" data-i18n-aria-label="settings.navigation.label">
          <button class="nav-item active" data-tab="general"><span class="nav-icon">◉</span><span data-i18n="settings.navigation.general">General</span></button>
          <button class="nav-item" data-tab="agents"><span class="nav-icon">⌘</span><span data-i18n="settings.navigation.agents">Agents</span></button>
          <button class="nav-item" data-tab="appearance"><span class="nav-icon">◆</span><span data-i18n="settings.navigation.appearance">Appearance &amp; Pet</span></button>
          <button class="nav-item" data-tab="sound"><span class="nav-icon">♪</span><span data-i18n="settings.navigation.sound">Sound</span></button>
          <button class="nav-item" data-tab="remote"><span class="nav-icon">⇄</span><span data-i18n="settings.navigation.remote">SSH Remote</span></button>
          <button class="nav-item" data-tab="mcp"><span class="nav-icon">◇</span><span data-i18n="settings.navigation.mcp">MCP</span></button>
          <button class="nav-item" data-tab="about"><span class="nav-icon">ⓘ</span><span data-i18n="settings.navigation.about">About</span></button>
        </nav>
      </aside>
      <div id="content" class="content"></div>
    </main>
    <div id="toast" class="toast" role="status"></div>
  </body>
</html>
