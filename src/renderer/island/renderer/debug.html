<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkIsland Debug</title>
    <script type="module" src="../../debug-app.js"></script>
    <link rel="stylesheet" href="../../debug-app.css">
  </head>
  <body>
    <main>
      <header>
        <h1 data-i18n="debug.title">WorkIsland Debug</h1>
        <div class="actions">
          <button id="refresh" type="button" data-i18n="debug.actions.refresh"></button>
          <button id="reset-onboarding" type="button" data-i18n="debug.actions.reset"></button>
        </div>
      </header>
      <div id="status" role="status" data-i18n="debug.status.loading"></div>
      <div class="grid">
        <section><h2 data-i18n="debug.sections.sessions"></h2><pre id="sessions">[]</pre></section>
        <section><h2 data-i18n="debug.sections.hooks"></h2><pre id="hooks">[]</pre></section>
      </div>
    </main>
  </body>
</html>
